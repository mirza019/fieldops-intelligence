[project]
name = "fieldops-intelligence"
version = "0.1.0"
description = "Synthetic industrial field-service analytics platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "faker>=30,<40",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]
streamlit = ["duckdb>=1.1,<2", "plotly>=5.24,<7", "pyarrow>=18,<23", "streamlit>=1.40,<2"]
fabric = ["fabric-cicd>=0.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics*", "backend*", "data*", "scripts*", "streamlit_app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["data/generators/tests", "backend/tests", "analytics/kpis/tests", "analytics/reporting/tests", "streamlit_app/tests", "powerbi/validation"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
