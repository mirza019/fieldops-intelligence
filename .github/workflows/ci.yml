name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e '.[dev,streamlit]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.validate_powerbi
      - run: python -m scripts.build_demo_data --profile small --output /tmp/fieldops-demo
      - run: python -m compileall backend analytics streamlit_app scripts
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package.json}
      - run: npm install
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit
      - run: pip-audit -r streamlit_app/requirements.txt
